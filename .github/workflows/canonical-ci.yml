name: 🛡️ Canonical Migration & Cross-Platform Roundtrip CI (Windows + Linux)

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

jobs:
  canonical-verification:
    name: 🧪 Canonical Migration & Roundtrip (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔍 Verify Dual-Mode Canonical Schema
        run: node scripts/verify_canonical_schema.mjs

      - name: 🧪 Run Canonical Migration & State Machine Tests
        run: node scripts/test_canonical_migration.mjs

      - name: 🔄 Run Isolated Prune -> Verify -> Rollback Round-Trip Test
        run: node scripts/test_prune_roundtrip.mjs

      - name: 🛡️ Run Semantic Gates & Listening Anti-Leak Check
        run: node scripts/audit_semantic_gates.mjs

      - name: 📗 Verify SAA 113 Official Papers & Source Isolation
        run: node scripts/test_saa_113_contract.mjs

      - name: 📊 Run Batch Expansion Quota & Dynamic Stats Contract Test
        run: node scripts/test_batch_a_contract.mjs

      - name: ✍️ Run Flexible Handwriting Order & Manuscript Form Contract
        run: node scripts/test_handwriting_flexible_order.mjs

  priori-verification:
    name: 🌱 PRIORI Contracts, Lint, Build & Chrome E2E
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run PRIORI Contracts (Drill + 113 G3–G6 + 114 G3–G6 + 115 Math G3)
        run: |
          node scripts/test_priori_drill_contract.mjs
          node scripts/test_priori_112_g3_6_contract.mjs
          node scripts/test_priori_113_g3_6_contract.mjs
          node scripts/test_priori_114_g3_contract.mjs
          node scripts/test_priori_114_g4_6_contract.mjs
          node scripts/test_priori_115_math_g3_contract.mjs

      - name: 🐘 Run Real PostgreSQL + pgcrypto SQL & Migration Security Tests
        run: node scripts/test_priori_sql_pg.mjs

      - name: 🧹 ESLint Check
        run: npm run lint

      - name: 🏗️ Production Build
        run: npm run build

      - name: 🌐 Run PRIORI Headless Chrome E2E
        run: node scripts/verify_priori_e2e.mjs

